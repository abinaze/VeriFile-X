name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1 libmagic-dev file
    
    - name: Install dependencies (Windows - python-magic-bin)
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install python-magic-bin==0.4.14
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 backend/ --max-line-length=120 || true
      continue-on-error: true

    - name: Type check with mypy
      run: |
        pip install mypy
        mypy backend/ --config-file=mypy.ini || true
      continue-on-error: true

    - name: Security audit with pip-audit
      run: |
        pip install pip-audit
        pip-audit || true
      continue-on-error: true

    - name: Run fast tests
      run: |
        pytest backend/tests/ -v -m "not slow" --tb=short

    - name: Run slow tests (ML models)
      if: success()
      run: |
        pytest backend/tests/ -v -m "slow" --tb=short
      continue-on-error: true
