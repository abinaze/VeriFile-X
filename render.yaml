services:
  # Backend API Service
  - type: web
    name: verifile-x-api
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: "https://abinaze.github.io,https://abinazebinoy-verifile-x-api.hf.space"
      - key: MAX_FILE_SIZE_MB
        value: 50
      - key: MAX_ANALYSIS_SIZE_MB
        value: 10
      - key: RATE_LIMIT_PER_MINUTE
        value: 10
      - key: CACHE_TTL_MINUTES
        value: 60
      - key: MAX_CACHE_SIZE
        value: 500
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_DEMO_KEY
        value: vfx_public_demo_2026
        # Must exactly match the PUBLIC_DEMO_KEY JS constant in
        # frontend/index.html (F-1). Not a secret -- it ships in the
        # frontend's own plaintext JS source already, visible to anyone
        # via view-source. Committing the same value here (rather than
        # sync: false, which is reserved for genuinely secret values
        # like ADMIN_KEY_HASH) is deliberate: this env var being unset
        # is exactly what silently breaks the public demo again with
        # "Authorization header required", since
        # require_analyst_or_demo fails closed when it's empty.
      - key: ADMIN_KEY_HASH
        sync: false
        # Set this manually in the Render dashboard (Environment tab) to a
        # SHA-256 hash of your chosen admin key — do not commit the actual
        # hash or key to this file. Admin endpoints (metrics reset, etc.)
        # return 503 until this is configured; that is the intended,
        # fail-closed default, not a bug. Never set ALLOW_INSECURE_ADMIN
        # here.
    healthCheckPath: /health


  # Frontend Static Site
  #
  # F-25 (decision needed, not resolved this session): .github/workflows/
  # deploy-pages.yml deploys ./frontend to GitHub Pages on every push to
  # main, and the README/live links all point to the abinaze.github.io
  # URL -- not this Render static site. This block may be dead
  # configuration (nobody currently points here) rather than an active
  # second deployment target. GitHub Pages also does not support custom
  # response headers at all, so the X-Frame-Options/X-Content-Type-
  # Options/Referrer-Policy headers below are currently not reaching the
  # actual live frontend regardless. Left in place rather than deleted,
  # since a static code snapshot can't confirm whether this Render
  # service is actually provisioned/relied on in the real Render
  # dashboard -- deleting it here would be a real infrastructure
  # decision, not a code fix. Decide: either start actually using this
  # as the real frontend deployment (getting real security headers in
  # the process), or remove this block and rely on GitHub Pages alone.
  - type: web
    name: verifile-x
    runtime: static
    buildCommand: "echo 'No build needed - static HTML'"
    staticPublishPath: ./frontend
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
